shop(q){const c=q.get("c")||"",bd=q.get("b")||"",sz=q.get("s")||"",co=q.get("k")||"",pr=q.get("p")||"",so=q.get("o")||"new",qs=(q.get("q")||"").toLowerCase();
let L=P.filter(p=>(!c||p.cat.includes(c))&&(!bd||p.b==bd)&&(!sz||p.sz==sz)&&(!co||p.c==co)&&(!qs||(p.b+" "+p.n).toLowerCase().includes(qs))&&(!pr||(pr=="1"?p.p<10000:pr=="2"?p.p>=10000&&p.p<15000:p.p>=15000)));
if(so=="lo")L.sort((a,b)=>a.p-b.p);if(so=="hi")L.sort((a,b)=>b.p-a.p);
const sel=(id,lab,opts,v)=>`<label class="lab">${lab} <select data-f="${id}"><option value="">All</option>${opts.map(o=>{const[val,t]=Array.isArray(o)?o:[o,o];return`<option value="${val}"${v==val?" selected":""}>${t}</option>`}).join("")}</select></label>`;
return`<section class="shophead"><p class="lab mute">${c||"Everything"} / ${P.length} pairs</p><h1 class="disp">Shop All</h1></section>
<div class="bar"><div class="fs">${sel("c","Category",["Sneakers","Men","Women"],c)}${sel("b","Brand",BRANDS,bd)}${sel("s","Size",sizes,sz)}${sel("k","Condition",CONDS,co)}${sel("p","Price",[["1","Under 10,000"],["2","10,000 – 15,000"],["3","15,000+"]],pr)}</div>
<label class="lab">Sort <select data-f="o"><option value="new">Newest</option><option value="lo"${so=="lo"?" selected":""}>Price: Low to High</option><option value="hi"${so=="hi"?" selected":""}>Price: High to Low</option></select></label></div>
<p class="cnt lab mute">${L.length} result${L.length==1?"":"s"}</p>
<section style="padding-top:28px">${L.length?`<div class="grid three">${L.map(p=>card(p)).join("")}</div>`:`<p class="serif" style="font-size:40px">Nothing matches — try loosening a filter.</p>`}</section>`},
new(){return`<section class="shophead"><p class="lab mute">Latest listings</p><h1 class="disp">New<br>Arrivals</h1></section><section><div class="grid">${P.filter(p=>p.a).map(p=>card(p)).join("")}</div></section>`},
product(s){const p=P.find(x=>x.s==s);if(!p)return`<section><h1 class="disp">Not found</h1><a class="btn l" href="#/shop" style="margin-top:30px">Back to shop</a></section>`;
document.title=`${p.b} ${p.n} — FARFITS`;const more=P.filter(x=>x.s!=s&&x.a).slice(0,4);
return`<div class="pdp"><div class="imgs">${pimg(p,"4/5")}<div class="two">${ph(p.t,"Detail — toe box","1/1")}${ph(p.t,"Detail — sole","1/1")}</div>${ph(p.t,"Back / heel","4/5")}</div>
<div class="info"><p class="lab mute"><a href="#/shop">Shop</a> / ${p.b}</p><h1 class="disp">${p.b}<br>${p.n}</h1><p style="font:800 26px 'Inter Tight';letter-spacing:-.03em">${pkr(p.p)}</p>
<dl><div><dt>Size</dt><dd>${p.sz} <span class="tag" style="margin-left:6px">Only size</span></dd></div><div><dt>Condition</dt><dd>${p.c}</dd></div><div><dt>Availability</dt><dd>${p.a?"In stock — 1 pair":"Sold"}</dd></div><div><dt>Authenticity</dt><dd>Inspected before listing</dd></div><div><dt>Exchange</dt><dd>Possible</dd></div></dl>
<p style="margin-bottom:24px">${p.d}</p>${p.a?`<button class="btn k full" data-add="${p.s}"><span>Add to Bag</span><span>→</span></button>`:`<a class="btn l full" target="_blank" rel="noopener" href="${IG}"><span>Ask for similar</span><span>↗</span></a>`}</div></div>
<div class="auth"><div><p class="lab" style="margin-bottom:22px">Authenticity</p><q>Every pair is carefully selected and inspected before being listed.</q></div><div><p class="lab" style="margin-bottom:22px">Exchange policy</p><q class="serif" style="font-weight:400;letter-spacing:-.02em">Exchange possible.</q><a class="lab" href="#/exchange-policy" style="display:inline-block;margin-top:24px;border-bottom:1px solid">Read the policy</a></div></div>
<section><div class="sh"><h2 class="disp" style="font-size:clamp(34px,6vw,90px)">More to wear</h2></div><div class="grid">${more.map(x=>card(x)).join("")}</div></section>`},
about(){return`<section style="padding-bottom:0"><p class="lab">About FARFITS</p><h1 class="disp" style="font-size:clamp(50px,12vw,200px);margin:24px 0">Authentic<br>footwear.<br><span class="serif" style="text-transform:none">Curated differently.</span></h1></section>
<section class="two-c" style="align-items:start">${ph("#dedede","Editorial photo — store / shelf","4/5")}<div class="prose" style="padding-top:5vw"><p style="font-size:clamp(20px,2vw,28px);letter-spacing:-.02em;line-height:1.2">FARFITS is an authentic thrift shoe store built around carefully selected footwear, distinctive finds, and pieces worth wearing again.</p><p class="mute" style="margin-top:20px">Every pair is selected with attention to authenticity, condition, and character. We list one of each, say plainly what condition it's in, and offer exchanges if it isn't right.</p><a class="btn k" style="margin-top:30px" href="#/shop">Shop collection →</a></div></section>${visit()}`},
contact(){return`<section class="two-c"><div class="prose"><p class="lab">Contact</p><h1 class="disp">Say<br>hello</h1><p>Questions on sizing, condition or a pair you've spotted? Message us on Instagram or visit the store.</p><p><a href="${IG}" target="_blank" rel="noopener" style="border-bottom:1px solid">@farfits.pk</a></p><p>North Nazimabad, Block H<br>5 Star Food Street, Issa Laboratory Street<br>Karachi — 4:30 PM – 2:00 AM</p></div>
<form class="form" onsubmit="event.preventDefault();toast('Opening Instagram');window.open('${IG}','_blank')"><label class="lab">Name<input required autocomplete="name"></label><label class="lab">Email<input type="email" required autocomplete="email"></label><label class="lab">Message<textarea rows="5" required></textarea></label><button class="btn k">Send →</button><p class="mute" style="margin-top:12px;font-size:12px">Demo form — connect to your email/WhatsApp handler before launch.</p></form></section>`},
exchange(){return`<section><div class="prose"><p class="lab">Policy</p><h1 class="disp">Exchange<br>policy</h1><p style="font:700 clamp(26px,3vw,40px)/1.05 'Inter Tight';letter-spacing:-.03em;margin-bottom:30px">Exchange possible.</p><p>If a pair isn't right, talk to us and we'll work out an exchange against other stock.</p><h3 class="lab">Terms to confirm</h3><p class="mute">Exchange window, condition requirements and refund rules — edit this section with FARFITS' final terms before launch.</p><h3 class="lab">Authenticity</h3><p>Every pair is carefully selected and inspected before being listed.</p></div></section>`},
cart(){const it=cart.map(s=>P.find(p=>p.s==s)).filter(Boolean);const tot=it.reduce((a,p)=>a+p.p,0);
const msg=encodeURIComponent("Hi FARFITS, I'd like to order:\n"+it.map(p=>`- ${p.b} ${p.n} (Size ${p.sz}) ${pkr(p.p)}`).join("\n"));
return`<section><p class="lab mute">Your bag</p><h1 class="disp" style="font-size:clamp(50px,10vw,150px);margin-bottom:40px">Bag</h1><div style="max-width:900px">${it.length?it.map(p=>`<div class="row">${pimg(p,"1/1")}<div><b class="lab">${p.b}</b><p style="font-weight:700;font-size:17px">${p.n}</p><p class="mute">Size ${p.sz} · ${p.c}</p></div><div style="text-align:right"><p style="font-weight:700">${pkr(p.p)}</p><button class="lab mute" data-rm="${p.s}" style="border-bottom:1px solid">Remove</button></div></div>`).join("")+`<div class="sum"><span>Total</span><span>${pkr(tot)}</span></div><p class="mute" style="margin:14px 0 24px">One-of-one pairs. Checkout is by direct message — confirm size and delivery with us on Instagram. Exchange possible.</p><a class="btn k" target="_blank" rel="noopener" href="${IG}">Order via Instagram ↗</a> <button class="btn l" data-copy="${msg}">Copy order</button>`:`<p class="serif" style="font-size:44px;margin-bottom:28px">Your bag is empty.</p><a class="btn k" href="#/shop">Shop collection →</a>`}</div></section>`}};
function visit(){return`<section class="visit"><div><p class="lab" style="margin-bottom:24px">Store</p><h2 class="disp">Visit<br>FARFITS</h2><address>North Nazimabad, Block H<br>5 Star Food Street<br>Issa Laboratory Street<br>Karachi</address><p class="lab" style="margin:30px 0 4px">Hours</p><p style="font:700 26px 'Inter Tight';letter-spacing:-.03em">4:30 PM – 2:00 AM</p><a class="btn k" style="margin-top:34px" target="_blank" rel="noopener" href="${MAP}">Get directions ↗</a></div>
<div class="map" role="img" aria-label="Map location block: FARFITS, North Nazimabad Block H"><span class="st" style="left:0;right:0;top:46%;height:34px"></span><span class="st" style="top:0;bottom:0;left:52%;width:34px;transform:translateX(-6px)"></span><span class="st" style="left:0;right:0;top:20%;height:14px"></span><span class="st" style="top:0;bottom:0;left:22%;width:14px"></span><span class="pin"></span><span class="lb">FARFITS</span></div></section>`}
function footer(){return`<footer><div class="fg"><div><a class="logo" href="#/" style="color:#fff;padding:0"><span class="mono">F</span>FARFITS</a><p class="lab" style="margin-top:18px">Authentic Thrift Footwear</p><p class="mute" style="margin-top:4px">Karachi, Pakistan</p></div>
<div><p class="lab mute" style="margin-bottom:10px">Browse</p><a href="#/shop">Shop</a><a href="#/about">About</a><a href="#/contact">Contact</a></div><div><p class="lab mute" style="margin-bottom:10px">Help</p><a href="#/exchange-policy">Exchange policy</a><a href="${MAP}" target="_blank" rel="noopener">Store location</a></div><div><p class="lab mute" style="margin-bottom:10px">Social</p><a href="${IG}" target="_blank" rel="noopener">Instagram</a></div></div>
<div class="big disp" aria-hidden="true">FARFITS</div><div class="fb lab"><span>© 2026 FARFITS · farfits.pk</span><span>Authentic thrift footwear</span></div></footer>`}

let raf;function route(){const h=location.hash.slice(1)||"/",[path,qs]=h.split("?"),q=new URLSearchParams(qs||""),app=$("#app");
const seg=path.split("/").filter(Boolean);let html,home=false;document.title="FARFITS — Authentic Thrifted Footwear, Karachi";
if(!seg.length){html=R.home();home=true}else if(seg[0]=="shop")html=R.shop(q);else if(seg[0]=="new-arrivals")html=R.new();else if(seg[0]=="product")html=R.product(seg[1]);else if(seg[0]=="about")html=R.about();else if(seg[0]=="contact")html=R.contact();else if(seg[0]=="exchange-policy")html=R.exchange();else if(seg[0]=="cart")html=R.cart();else html=R.shop(q);
app.className=home?"home":"";app.style.animation="none";app.offsetWidth;app.style.animation="";app.innerHTML=html;$("#foot").innerHTML=footer();
$("#hd").classList.toggle("over",home&&scrollY<innerHeight*.8);$("#nv").classList.remove("open");$("#search").classList.remove("open");
$$("nav.main a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+path+(qs?"?"+qs:"")));
if(!seg.length||true)scrollTo(0,0);reveal();save()}
let io;function reveal(){io&&io.disconnect();io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{rootMargin:"0px 0px -6% 0px"});$$(".rv").forEach(e=>io.observe(e))}
addEventListener("hashchange",route);
addEventListener("scroll",()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const y=scrollY,hm=$("#app").classList.contains("home");$("#hd").classList.toggle("over",hm&&y<innerHeight*.8);const b=$("[data-par]");if(b&&y<innerHeight*1.2)b.style.transform=`translateY(${y*.15}px)`})},{passive:true});
document.addEventListener("click",e=>{const t=e.target;let a=t.closest("[data-add]");
if(a){e.preventDefault();e.stopPropagation();const s=a.dataset.add;if(cart.includes(s))toast("Already in your bag — one of one");else{cart.push(s);save();toast("Added to bag")}return}
a=t.closest("[data-rm]");if(a){cart=cart.filter(s=>s!=a.dataset.rm);save();route();return}
a=t.closest("[data-copy]");if(a){const m=decodeURIComponent(a.dataset.copy);try{navigator.clipboard.writeText(m);toast("Order copied")}catch(x){toast("Copy not available")}return}
if(t.closest("#bg"))$("#nv").classList.toggle("open");if(t.closest("#nv a"))$("#nv").classList.remove("open");
if(t.closest("#bs")){$("#search").classList.toggle("open");$("#si").focus()}});
document.addEventListener("change",e=>{const s=e.target.closest("[data-f]");if(!s)return;const q=new URLSearchParams(location.hash.split("?")[1]||"");const m={c:"c",b:"b",s:"s",k:"k",p:"p",o:"o"};s.value?q.set(m[s.dataset.f],s.value):q.delete(m[s.dataset.f]);location.hash="/shop?"+q})
$("#si").addEventListener("input",e=>{const v=e.target.value.toLowerCase().trim();$("#sres").innerHTML=v?P.filter(p=>(p.b+" "+p.n).toLowerCase().includes(v)).slice(0,6).map(p=>`<a href="#/product/${p.s}">${p.b} ${p.n}</a>`).join("")||"<span class='mute'>No results</span>":""});
$("#si").addEventListener("keydown",e=>{if(e.key=="Enter")location.hash="/shop?q="+encodeURIComponent(e.target.value)});
// cursor
const cu=$("#cur");let cx=0,cy=0,tx=0,ty=0;addEventListener("pointermove",e=>{tx=e.clientX;ty=e.clientY},{passive:true});
(function f(){cx+=(tx-cx)*.22;cy+=(ty-cy)*.22;cu.style.transform=`translate(${cx-6}px,${cy-6}px)`;requestAnimationFrame(f)})();
document.addEventListener("pointerover",e=>cu.classList.toggle("big",!!e.target.closest("a,button,.ph,select")));
route();
</script></body></html>
